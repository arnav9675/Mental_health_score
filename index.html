```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mental Health Score Predictor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #5568d8;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            background: #f3f4ff;
            text-align: center;
        }

        #result h2 {
            color: #333;
            margin-bottom: 10px;
        }

        #score {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        #error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #ffe5e5;
            color: #c62828;
            text-align: center;
        }

        .note {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Mental Health Score Predictor</h1>

    <p class="subtitle">
        Enter your details to predict your mental health score.
    </p>

    <form id="predictionForm">

        <!-- Replace these fields with the exact fields expected by your main.py -->

        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" name="age" required>
        </div>

        <div class="form-group">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label for="academic_pressure">Academic Pressure</label>
            <input
                type="number"
                id="academic_pressure"
                name="academic_pressure"
                step="any"
                required
            >
        </div>

        <div class="form-group">
            <label for="work_pressure">Work Pressure</label>
            <input
                type="number"
                id="work_pressure"
                name="work_pressure"
                step="any"
                required
            >
        </div>

        <div class="form-group">
            <label for="study_satisfaction">Study Satisfaction</label>
            <input
                type="number"
                id="study_satisfaction"
                name="study_satisfaction"
                step="any"
                required
            >
        </div>

        <div class="form-group">
            <label for="sleep_duration">Sleep Duration</label>
            <input
                type="number"
                id="sleep_duration"
                name="sleep_duration"
                step="any"
                required
            >
        </div>

        <div class="form-group">
            <label for="financial_stress">Financial Stress</label>
            <input
                type="number"
                id="financial_stress"
                name="financial_stress"
                step="any"
                required
            >
        </div>

        <button type="submit" id="predictButton">
            Predict Mental Health Score
        </button>

    </form>

    <div id="result">
        <h2>Predicted Score</h2>
        <div id="score"></div>
    </div>

    <div id="error"></div>

    <p class="note">
        This prediction is generated by a machine learning model and is not
        a medical diagnosis.
    </p>

</div>


<script>

    const form = document.getElementById("predictionForm");
    const button = document.getElementById("predictButton");

    const resultBox = document.getElementById("result");
    const scoreBox = document.getElementById("score");
    const errorBox = document.getElementById("error");


    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        resultBox.style.display = "none";
        errorBox.style.display = "none";

        button.disabled = true;
        button.innerText = "Predicting...";


        const data = {

            age: Number(document.getElementById("age").value),

            gender: document.getElementById("gender").value,

            academic_pressure:
                Number(document.getElementById("academic_pressure").value),

            work_pressure:
                Number(document.getElementById("work_pressure").value),

            study_satisfaction:
                Number(document.getElementById("study_satisfaction").value),

            sleep_duration:
                Number(document.getElementById("sleep_duration").value),

            financial_stress:
                Number(document.getElementById("financial_stress").value)
        };


        try {

            /*
             * IMPORTANT:
             *
             * Do NOT use:
             * http://127.0.0.1:8000/predict
             *
             * Do NOT use:
             * http://localhost:8000/predict
             *
             * We use /predict so that the same code works
             * both locally and on Render.
             */

            const response = await fetch("/predict", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)

            });


            if (!response.ok) {

                throw new Error(
                    "Server returned error: " + response.status
                );

            }


            const result = await response.json();

            console.log("API Response:", result);


            /*
             * Your main.py must return a field containing
             * the prediction.
             *
             * If your response field has a different name,
             * change result.prediction below.
             */

            const prediction =
                result.prediction ??
                result.predicted_score ??
                result.score;


            if (prediction === undefined) {

                throw new Error(
                    "Prediction field was not found in API response."
                );

            }


            scoreBox.innerText = prediction;

            resultBox.style.display = "block";

        }

        catch (error) {

            console.error("Prediction error:", error);

            errorBox.innerText =
                "Unable to get prediction. Please check the server.";

            errorBox.style.display = "block";

        }

        finally {

            button.disabled = false;

            button.innerText =
                "Predict Mental Health Score";

        }

    });

</script>

</body>
</html>
